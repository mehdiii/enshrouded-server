services:
  enshrouded:
    image: mornedhels/enshrouded-server:1.7.2-wine  # Wine : la variante Proton (latest) ne démarre pas avec Enshrouded 1.0 (issue #254)
    container_name: enshrouded
    hostname: enshrouded
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 6g
    ports:
      - "15637:15637/udp"
    volumes:
      - ./game:/opt/enshrouded
      # Script de sauvegarde corrigé pour le format Enshrouded 1.0 (upstream PR #256), à retirer quand l'image l'intégrera
      - ./patches/enshrouded-backup:/usr/local/etc/enshrouded/enshrouded-backup:ro
    devices:
      - /dev/ntsync:/dev/ntsync
    environment:
      - SERVER_NAME=${SERVER_NAME}
      - SERVER_SLOT_COUNT=4
      # Difficulté et mot de passe « Amis » : gérés dans game/server/enshrouded_server.json (/difficulte, /motdepasse du bot)
      - SERVER_ENABLE_TEXT_CHAT=true
      - SERVER_ENABLE_VOICE_CHAT=false
      # Admin : tous les droits
      - SERVER_ROLE_0_NAME=Admin
      - SERVER_ROLE_0_PASSWORD=${ADMIN_PASSWORD}
      - SERVER_ROLE_0_CAN_KICK_BAN=true
      - SERVER_ROLE_0_CAN_ACCESS_INVENTORIES=true
      - SERVER_ROLE_0_CAN_EDIT_WORLD=true
      - SERVER_ROLE_0_CAN_EDIT_BASE=true
      - SERVER_ROLE_0_CAN_EXTEND_BASE=true
      - SERVER_ROLE_0_RESERVED_SLOTS=1
      # Amis : peuvent construire, pas kick/ban
      - SERVER_ROLE_1_NAME=Amis
      - SERVER_ROLE_1_CAN_ACCESS_INVENTORIES=true
      - SERVER_ROLE_1_CAN_EDIT_WORLD=true
      - SERVER_ROLE_1_CAN_EDIT_BASE=true
      - SERVER_ROLE_1_CAN_EXTEND_BASE=true
      - UPDATE_CRON=*/30 * * * *
      - UPDATE_CHECK_PLAYERS=true
      - BACKUP_CRON=0 */2 * * *
      - BACKUP_MAX_COUNT=24
      - PUID=1000
      - PGID=1000
